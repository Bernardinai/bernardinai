name: Dienos Apzvalga (Reels/Shorts)

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasiimame repozitorijos failus
        uses: actions/checkout@v3

      - name: Paruošiame Python aplinką
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Įdiegiame reikalingas bibliotekas
        run: |
          python -m pip install --upgrade pip
          pip install feedparser Pillow numpy moviepy==1.0.3 edge-tts google-generativeai

      - name: Paleidžiame Reels agentą
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python reels_agent.py

      - name: Išsaugome sugeneruotą video atgal į GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bernardinai_dienos_apzvalga.mp4
          git commit -m "Atnaujintas Reels vaizdo įrašas" || echo "Nėra jokių naujų pakeitimų"
          git push
