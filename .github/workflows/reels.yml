name: Bernardinai Reels Bot

on:
  repository_dispatch:
    types: [paleisti_reels] # Klausosi išorinio cron-job.org žadintuvo
  workflow_dispatch:        # Leidžia paleisti rankiniu būdu testavimui

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        if ! fc-list | grep -qi "DejaVu"; then
          sudo apt-get -o Acquire::Retries=5 update || true
          sudo apt-get -o Acquire::Retries=5 install -y --fix-missing fonts-dejavu || true
        fi
        python -m pip install --upgrade pip
        pip install feedparser "Pillow==9.5.0" "numpy<2.0.0" moviepy==1.0.3 edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Run script
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: python reels_agent.py
