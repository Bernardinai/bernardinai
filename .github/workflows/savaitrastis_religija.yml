name: Religijos Savaitrastis

on:
  repository_dispatch:
    types: [paleisti_religijos_savaitrasti] # Klausosi išorinio cron-job.org žadintuvo
  workflow_dispatch:
    inputs:
      paleidimo_rezimas:
        description: '1. Paleidimo režimas'
        required: true
        type: choice
        default: 'bandomasis'
        options:
          - bandomasis
          - tikras
          - tik_atnaujinti_pdf
      leidinio_numeris:
        description: '2. Leidinio numeris (tuščia = automatiškai, arba įrašykite pvz.: 47 arba 2026/47)'
        required: false
        type: string
        default: ''
      leidinio_data:
        description: '3. Leidinio data YYYY-MM-DD (tuščia = šiandien, arba pvz.: 2026-11-22)'
        required: false
        type: string
        default: ''
      siusti_naujienlaiski:
        description: '4. MailerLite naujienlaiškis (auto = pagal režimą)'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - siusti
          - juodrastis
          - nesiusti
      publikuoti_wp:
        description: '5. WordPress įrašas svetainėje (auto = pagal režimą)'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - publish
          - draft
          - ne

permissions:
  contents: write

jobs:
  kurti-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Atsisiunciami repozitorijos failai
        uses: actions/checkout@v4

      - name: 2. Paruosiama Python aplinka
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Diegiamos Linux sistemos bibliotekos
        run: |
          if ! dpkg -s libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=5 update || true
            sudo apt-get -o Acquire::Retries=5 install -y --fix-missing libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 || true
          fi

      - name: 4. Diegiamos Python bibliotekos
        run: |
          python -m pip install --upgrade pip
          pip install feedparser weasyprint tzdata Pillow

      - name: 5. Generuojamas religijos savaitrastis
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          # Kai pažadina cron-job.org (repository_dispatch), automatiškai leidžia įprastą tikrą numerį:
          EVENT_NAME: ${{ github.event_name == 'repository_dispatch' && 'schedule' || github.event_name }}
          PALEIDIMO_REZIMAS: ${{ github.event_name == 'repository_dispatch' && 'tikras' || inputs.paleidimo_rezimas }}
          LEIDINIO_NUMERIS_CUSTOM: ${{ inputs.leidinio_numeris }}
          LEIDINIO_DATA_CUSTOM: ${{ inputs.leidinio_data }}
          SIUSTI_NAUJIENLAISKI: ${{ github.event_name == 'repository_dispatch' && 'auto' || inputs.siusti_naujienlaiski }}
          PUBLIKUOTI_WP: ${{ github.event_name == 'repository_dispatch' && 'auto' || inputs.publikuoti_wp }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CATEGORY_ID_RELIGIJA: ${{ secrets.WP_CATEGORY_ID_RELIGIJA }}
          MAILERLITE_GROUP_ID_RELIGIJA: ${{ secrets.MAILERLITE_GROUP_ID_RELIGIJA }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CF_AUTOMATION_KEY: ${{ secrets.CF_AUTOMATION_KEY }}
        run: python naujienlaiskis_religija.py

      - name: 6. Issaugomas archyvas repozitorijoje
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archyvas/ leidinio_numeris_religija.txt
          if ! git diff --staged --quiet; then
            git commit -m "Automatinis Religijos PDF archyvo papildymas (${{ inputs.paleidimo_rezimas || 'schedule' }})"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi

      - name: 7. Patogus PDF atsiuntimas per Actions langa
        uses: actions/upload-artifact@v4
        with:
          name: religijos-savaitrastis-pdf
          path: archyvas/*/*religijos_savaitrastis_*.pdf
          retention-days: 14
