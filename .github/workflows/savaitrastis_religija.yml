name: Religijos Savaitrastis

on:
  schedule:
    # Sekmadieniais 04:40 UTC laiku (~07:40 Lietuvos laiku)
    - cron: '40 4 * * 0'
  workflow_dispatch:
    inputs:
      tikras_leidinys:
        description: 'Pazymeti, jei norite isleisti TIKRA numeri'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  kurti-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Atsisiunciami repozitorijos failai
        uses: actions/checkout@v4

      - name: 2. Paruosiama Python aplinka
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Diegiamos Linux sistemos bibliotekos
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: 4. Diegiamos Python bibliotekos
        run: |
          python -m pip install --upgrade pip
          pip install feedparser weasyprint tzdata

      - name: 5. Generuojamas religijos savaitrastis
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          TIKRAS_LEIDINYS: ${{ github.event.inputs.tikras_leidinys }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CATEGORY_ID_RELIGIJA: ${{ secrets.WP_CATEGORY_ID_RELIGIJA }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python naujienlaiskis_religija.py

      - name: 6. Issaugomas archyvas repozitorijoje
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archyvas/ leidinio_numeris_religija.txt
          if ! git diff --staged --quiet; then
            git commit -m "Automatinis Religijos PDF archyvo papildymas"
            git pull --rebase origin main
            git push
          fi

      - name: 7. Patogus PDF atsiuntimas per Actions langą (Atsarginė kopija)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: religijos-savaitrastis-pdf
          path: archyvas/

      - name: 8. Pranesimas apie SEKMINGA leidini
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Religijos savaitraštis sėkmingai sugeneruotas ir paruoštas"
          to: ${{ secrets.NOTIFICATION_EMAIL || 'redakcija@bernardinai.lt' }}
          from: "Savaitraščio Botas <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Religijos naujienų ir tikėjimo savaitraštis sėkmingai sugeneruotas!
            
            - PDF failas sukurtas ir įkeltas į archyvą.
            - Įrašas WordPress svetainėje sukurtas.
            - MailerLite kampanija paruošta.
            - Paleidimo tipas: ${{ github.event.inputs.tikras_leidinys && 'Tikras numeris' || 'Bandomasis / Automatinis' }}

      - name: 9. Pranesimas ivyks KLAIDAI
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ KLAIDA: Religijos savaitraščio generavimas nepavyko"
          to: ${{ secrets.NOTIFICATION_EMAIL || 'redakcija@bernardinai.lt' }}
          from: "Savaitraščio Botas <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Generuojant Religijos savaitraštį įvyko klaida!
            
            Patikrinkite veiksmų žurnalą GitHub Actions aplinkoje:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
