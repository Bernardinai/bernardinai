name: Bernardinai Video Agent

on:
  repository_dispatch:
    types: [paleisti_video] # Klausosi išorinio cron-job.org žadintuvo
  workflow_dispatch:        # Leidžia paleisti rankiniu būdu testavimui

permissions:
  contents: write           # Leidžia agentui įrašyti video atgal į repozitoriją

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Atsisiunčiami repozitorijos failai
      uses: actions/checkout@v4

    - name: 2. Paruošiama Python aplinka
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Įrašomos bibliotekos ir šriftai
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-dejavu
        python -m pip install --upgrade pip
        pip install feedparser Pillow moviepy==1.0.3

    - name: 4. Paleidžiamas agentas video kūrimui
      run: python agent.py

    - name: 5. Išsaugomas naujas video ir atnaujinama atmintis
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add last_article.txt bernardinai.mp4
        
        if ! git diff --staged --quiet; then
          git commit -m "Automatinis bernardinai.mp4 atnaujinimas"
          
          # Apsauga nuo konfliktų, jei tuo pat metu dirba Vatican News agentas (bando iki 3 kartų)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break || sleep 5
          done
        fi
